[project]
name = "khata-voice-backend"
version = "0.1.0"
description = "Khata Voice backend: voice-first AI credit ledger for Paytm merchants"
authors = [
    { name = "tejasterse", email = "tersetejas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "apscheduler<4",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "indic-transliteration>=2.3.82",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
