services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: khata
      POSTGRES_PASSWORD: khata
      POSTGRES_DB: khata
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khata"]
      interval: 2s
      retries: 15

  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://khata:khata@db:5432/khata
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
